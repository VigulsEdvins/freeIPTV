name: Автообновление плейлиста

on:
  schedule:
    - cron: '0 3 * * *' # Каждый день в 03:00 UTC
  workflow_dispatch: # Возможность запустить вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: setup-python@v5
        with:
          python-version: '3.x'

      - name: Генерация плейлиста
        run: python3 build_playlist.py

      - name: Коммит и пуш обновлений
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление плейлиста [skip ci]" && git push)
